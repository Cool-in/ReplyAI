name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package local app bundle
        run: ./scripts/build-app.sh
      - name: Package release zip
        run: ./scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ReplyAI-release
          path: dist/ReplyAI-*.zip
